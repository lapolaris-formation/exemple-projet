name: Build

on:
  push:
    branches: [ main, 'release/**' ]
  pull_request:
    branches: [ main, 'release/**' ]
  workflow_dispatch:

permissions:
  contents: read

# À adapter pour un nouveau projet : le nom de la solution et celui du projet de l'application
env:
  SOLUTION: ExempleProjet.sln
  PROJET: ExempleProjet

jobs:
  build:
    # .NET Framework 4.8 + resx binaires (icônes/images) => MSBuild "complet" de Visual Studio obligatoire.
    # "dotnet build" échoue sur ce type de projet (MSB3822 / MSB3823).
    runs-on: windows-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Installer MSBuild
        uses: microsoft/setup-msbuild@v3

      # dotnet restore ne lit pas packages.config : c'est MSBuild qui restaure (sans nuget.exe)
      - name: Restaurer les paquets (packages.config)
        run: msbuild ${{ env.SOLUTION }} -t:restore -p:RestorePackagesConfig=true

      - name: Compiler
        # Un projet d'installation (.vdproj) n'est pas supporté par MSBuild => warning MSB4078 attendu
        run: msbuild ${{ env.SOLUTION }} -p:Configuration=Release "-p:Platform=Any CPU" -m

      # Un build vert ne prouve pas que l'exécutable démarre : une mise à jour de paquet peut
      # livrer une DLL absente ou sans redirection de liaison.
      # La sonde charge chaque assembly référencé, avec la configuration réelle de l'exécutable.
      - name: Vérifier les liaisons des assemblies livrés
        shell: pwsh
        run: |
          $sortie = Join-Path $env:RUNNER_TEMP "liaisons"
          Copy-Item "$env:PROJET\bin\Release" -Destination $sortie -Recurse
          Copy-Item "$env:PROJET\bin\Release\$env:PROJET.exe.config" (Join-Path $sortie "verifier-liaisons.exe.config")
          & "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo "/out:$sortie\verifier-liaisons.exe" .github\outils\VerifierLiaisons.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & (Join-Path $sortie "verifier-liaisons.exe")
          exit $LASTEXITCODE

      - name: Téléverser les binaires
        uses: actions/upload-artifact@v7
        with:
          name: binaires-${{ github.sha }}
          path: ${{ env.PROJET }}/bin/Release/
          retention-days: 90
