name: Revue des dépendances

# Bloque une PR qui introduit un package NuGet vulnérable (lit packages.config via le dependency graph)
on:
  pull_request:
    branches: [ main, 'release/**' ]

permissions:
  contents: read
  pull-requests: write

jobs:
  revue-dependances:
    # Gratuit sur dépôt public ; sur dépôt privé, exige GitHub Code Security.
    # Sans cette licence : variable de dépôt CODE_SECURITY = non (le job est alors sauté)
    if: ${{ vars.CODE_SECURITY != 'non' }}
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Revue des dépendances
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
