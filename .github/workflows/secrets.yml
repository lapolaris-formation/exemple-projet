name: Détection de secrets

on:
  push:
    branches: [ main, 'release/**' ]
  pull_request:
    branches: [ main, 'release/**' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detection-secrets:
    # L'action gitleaks/gitleaks-action exige une licence pour un dépôt d'organisation :
    # on lance l'outil lui-même (licence MIT), version épinglée et empreinte vérifiée.
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - name: Récupérer le code (tout l'historique)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Installer Gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSLO "$base/$archive"
          curl -sSLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $archive\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "$archive" gitleaks

      # .gitleaks.toml (règles maison) et .gitleaksignore (trouvailles acquittées) sont lus à la racine
      - name: Rechercher des secrets dans tout l'historique
        run: ./gitleaks detect --source . --redact --verbose
