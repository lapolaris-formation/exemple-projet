name: Release

# Une version livrée = un tag vMAJEUR.MINEUR.CORRECTIF.
# Binaire, SBOM et attestation de provenance partent du même tag.
on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: read

# À adapter pour un nouveau projet : la solution, le projet de l'application et le nom du produit
env:
  SOLUTION: ExempleProjet.sln
  PROJET: ExempleProjet
  PRODUIT: ExempleProjet

jobs:
  binaire:
    # .NET Framework 4.8 : compilation MSBuild sur Windows
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write        # identité du workflow, qui signe l'attestation
      attestations: write    # sur dépôt privé : GitHub Enterprise Cloud requis
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Récupérer le code du tag
        uses: actions/checkout@v7

      - name: Installer MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Aligner la version de l'assembly sur le tag
        shell: pwsh
        run: |
          $version = $env:TAG.TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Tag attendu : vMAJEUR.MINEUR.CORRECTIF, reçu : $env:TAG" }
          $fichier = Join-Path $PWD "$env:PROJET\My Project\AssemblyInfo.vb"
          $texte = [IO.File]::ReadAllText($fichier) -replace 'Assembly(File)?Version\("[^"]*"\)', ('Assembly$1Version("' + $version + '.0")')
          [IO.File]::WriteAllText($fichier, $texte, (New-Object System.Text.UTF8Encoding($true)))
          Select-String -Path $fichier -Pattern '^<Assembly: Assembly(File)?Version'

      - name: Restaurer les paquets (packages.config)
        run: msbuild ${{ env.SOLUTION }} -t:restore -p:RestorePackagesConfig=true

      - name: Compiler
        run: msbuild ${{ env.PROJET }}\${{ env.PROJET }}.vbproj -p:Configuration=Release

      - name: Assembler le livrable
        shell: pwsh
        run: |
          $version = $env:TAG.TrimStart('v')
          New-Item -ItemType Directory -Force livrable | Out-Null
          Get-ChildItem "$env:PROJET\bin\Release" -Exclude *.pdb, *.xml |
            Compress-Archive -DestinationPath "livrable\$env:PRODUIT-$version.zip"
          "Version de $env:PROJET.exe : " + (Get-Item "$env:PROJET\bin\Release\$env:PROJET.exe").VersionInfo.FileVersion

      # Gratuit sur dépôt public ; sur dépôt privé, exige GitHub Enterprise Cloud.
      # Sans cette licence : variable de dépôt ATTESTATION = non (Settings, Secrets and variables, Actions, Variables)
      - name: Générer l'attestation de provenance
        if: ${{ vars.ATTESTATION != 'non' }}
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            ${{ env.PROJET }}/bin/Release/${{ env.PROJET }}.exe
            livrable/${{ env.PRODUIT }}-*.zip

      - name: Conserver le livrable
        uses: actions/upload-artifact@v7
        with:
          name: livrable
          path: livrable/
          retention-days: 90

  sbom:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Récupérer le code du tag
        uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Installer CycloneDX
        run: dotnet tool install --global CycloneDX --version 6.2.0

      # SBOM du PRODUIT (pas de la solution) : sans composants de tests, nom et version du tag.
      # Les DLL hors NuGet listées dans .github/outils/composants-hors-nuget.json y sont ajoutées.
      - name: Générer le SBOM du produit
        run: |
          VERSION="${TAG#v}"
          dotnet CycloneDX "$PROJET/$PROJET.vbproj" -o sbom -F Json -sn "$PRODUIT" -sv "$VERSION"
          python3 .github/outils/sbom-hors-nuget.py sbom/bom.json .github/outils/composants-hors-nuget.json
          mv sbom/bom.json "sbom/$PRODUIT-$VERSION.cdx.json"

      - name: Conserver le SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom/
          retention-days: 90

  publication:
    needs: [ binaire, sbom ]
    runs-on: ubuntu-latest
    permissions:
      contents: write        # créer la release et y attacher les fichiers
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Récupérer le livrable et le SBOM
        uses: actions/download-artifact@v8
        with:
          path: livraison
          merge-multiple: true

      # La release n'expire pas, contrairement aux artefacts (90 jours) : c'est elle qui archive la version
      - name: Créer la release
        run: |
          gh release create "$TAG" livraison/* --repo "$GITHUB_REPOSITORY" \
            --title "$PRODUIT ${TAG#v}" \
            --notes "Binaire construit par le pipeline depuis le tag $TAG. SBOM CycloneDX, DLL hors NuGet comprises. Vérifier la provenance : gh attestation verify $PROJET.exe --owner $GITHUB_REPOSITORY_OWNER."
