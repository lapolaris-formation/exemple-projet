# Dependabot : mises à jour de version (PR hebdo) pour NuGet (packages.config) et GitHub Actions.
# Les alertes de vulnérabilité et les "security updates" s'activent dans Settings > Advanced Security.
# Labels "dependances" et "ci" à créer AVANT la fusion de ce fichier.
version: 2
updates:
  - package-ecosystem: "nuget"
    directories:                   # un packages.config par projet : chaque dossier qui en a un doit être listé
      - "/tests/ExempleProjet.Tests"
      # - "/ExempleProjet"         # à décommenter dès que l'application a son propre packages.config
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 10
    labels: [ "dependances" ]
    commit-message:
      prefix: "build"
      include: "scope"
    # Mineures et correctives regroupées en une seule PR ; les majeures restent séparées
    groups:
      dependances-mineures:
        update-types: [ "minor", "patch" ]
    # Pour figer les montées majeures d'un paquet jusqu'à une migration préparée,
    # après une décision écrite dans une issue :
    # ignore:
    #   - dependency-name: "Nom.Du.Paquet"
    #     update-types: [ "version-update:semver-major" ]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    labels: [ "dependances", "ci" ]
