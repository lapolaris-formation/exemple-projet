# Dependabot : mises à jour de version (PR hebdo) pour NuGet (packages.config) et GitHub Actions.
# Les alertes de vulnérabilité + "security updates" s'activent dans Settings > Code security.
version: 2
updates:
  - package-ecosystem: "nuget"
    directories:                   # un packages.config par projet : chaque dossier doit être listé
      - "/WinVOIE"
      - "/tests/WinVOIE.Tests"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 10
    labels: [ "dependances" ]
    commit-message:
      prefix: "build"
      include: "scope"
    # Mineures et correctives regroupées en une seule PR ; les majeures restent séparées (jour 4)
    groups:
      dependances-mineures:
        update-types: [ "minor", "patch" ]
    # Décision de l'issue #25 : la ligne 8.x de ces paquets est figée tant que la migration
    # vers 10.x n'est pas faite AVEC PDFsharp (la PR #11 livrait un exécutable sans
    # Microsoft.Extensions.Logging.Abstractions.dll). Échéance : fin de support .NET 8, 10/11/2026.
    ignore:
      - dependency-name: "Microsoft.Extensions.*"
        update-types: [ "version-update:semver-major" ]
      - dependency-name: "Microsoft.Bcl.*"
        update-types: [ "version-update:semver-major" ]
      - dependency-name: "System.Security.Cryptography.Pkcs"
        update-types: [ "version-update:semver-major" ]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    labels: [ "dependances", "ci" ]
